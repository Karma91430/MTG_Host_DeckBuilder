services:
  deckbuilder:
    build: .
    image: mtg-deckbuilder:local
    container_name: mtg-deckbuilder
    restart: unless-stopped
    # Un volume monte conserve les droits de l'hote : le conteneur doit tourner
    # sous le proprietaire du dossier, sinon il ne peut pas y ecrire.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3646:3000"
    environment:
      MTGDECK_DATA_DIR: /data
    volumes:
      - /DATA/AppData/mtg-deckbuilder:/data
